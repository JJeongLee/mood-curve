<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회고 질문 카드 · 셀프 연말정산 모각회</title>
<meta name="description" content="회고하다 막힐 때 한 장 뽑아 쓰는 질문 30장이에요.">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --ink:#111; --sub:#555; --mute:#8a8a8a; --rule:#111; --cell:#cfcfcf; --fill:#efefef; --red:#c8372d; --paper:#fff; --desk:#e8e6e1;
  --serif:'AppleMyungjo','Nanum Myeongjo','Batang',serif;
  --sans:'SelfCheck Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --c1:#2f6f5e; --c2:#b5552f; --c3:#3a5a9b; --c4:#7a5a2e;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;margin:0}
.wrap{max-width:980px;margin:0 auto;padding:20px 28px 60px}
.nav{display:flex;gap:4px;justify-content:center;margin-bottom:16px;font-size:14px}
.nav a{padding:6px 14px;color:var(--sub);text-decoration:none;border:1px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current]{border-color:var(--rule);background:#fff;color:var(--ink);font-weight:600}
.sheet{background:var(--paper);border:1px solid var(--rule);padding:5px}
.sheet-in{border:1px solid var(--rule);padding:22px 30px 30px}
.form-top{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:.24em;text-indent:.24em;text-align:center;margin:4px 0 6px;line-height:1.3}
.guide{text-align:center;font-size:13.5px;color:var(--sub);margin:0 0 20px}

/* 뽑기 */
.draw{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0 26px;border-bottom:3px double var(--rule)}
.filters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px}
.filters button{border:1px solid var(--cell);background:#fff;padding:5px 11px;cursor:pointer;border-radius:999px}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.card{width:min(420px,100%);aspect-ratio:9/5;border:1px solid var(--rule);background:#fff;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:26px 30px;text-align:center;box-shadow:6px 6px 0 var(--fill)}
.card::before{content:'';position:absolute;inset:5px;border:1px solid var(--cell);pointer-events:none}
.card .cat{position:absolute;top:14px;left:18px;font-size:12px;font-weight:600;color:var(--cc,var(--mute))}
.card .no{position:absolute;top:14px;right:18px;font-size:12px;color:var(--mute)}
.card .q{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.5;word-break:keep-all}
.card .tip{position:absolute;bottom:13px;left:0;right:0;font-size:12px;color:var(--mute)}
.card.empty .q{color:var(--mute);font-weight:400;font-size:18px}
.card.flip{animation:flip .35s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.acts{display:flex;gap:10px}
.btn{border:1px solid var(--rule);background:#fff;padding:10px 20px;font-size:15px;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.left{font-size:12.5px;color:var(--mute)}

/* 전체 목록 */
.how{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0 6px;font-size:13px;color:var(--sub)}
.how div{border:1px solid var(--cell);padding:10px 12px;word-break:keep-all}
.how b{color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin-top:16px}
.group{margin-top:14px}
.group h2{font-size:14px;margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid var(--rule);color:var(--cc)}
.group h2 span{color:var(--mute);font-weight:400}
.group ol{margin:0;padding:0;list-style:none}
.group li{display:flex;gap:10px;padding:6px 2px;border-bottom:1px solid var(--fill);font-size:14.5px;word-break:keep-all;cursor:pointer}
.group li:hover{background:#fffaf3}
.group li i{font-style:normal;color:var(--mute);min-width:22px;text-align:right;font-size:13px;padding-top:1px}

@media (max-width:760px){
  .wrap{padding:12px 10px 40px}
  .sheet-in{padding:16px 14px 22px}
  h1{font-size:22px;letter-spacing:.12em;text-indent:.12em}
  .card .q{font-size:19px}
  .how,.list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a href="./">① 기분 곡선</a><a href="templates.html">② 회고 템플릿</a><a href="cards.html" aria-current="page">③ 질문 카드</a></nav>
  <main class="sheet"><div class="sheet-in">
    <div class="form-top"><span>■ 2026 셀프 연말정산 부속서류 제3호</span><span>질문 30장</span></div>
    <h1>회고 질문 카드</h1>
    <p class="guide">"뭘 써야 할지 모르겠다"는 순간에 한 장 뽑아 보세요.</p>

    <section class="draw">
      <div class="filters" id="filters"></div>
      <div class="card empty" id="card"><span class="cat" id="cat"></span><span class="no" id="no"></span><div class="q" id="q">카드를 뽑아 보세요</div><span class="tip" id="tip"></span></div>
      <div class="acts"><button class="btn primary" id="draw">한 장 뽑기</button></div>
      <div class="left" id="left"></div>
    </section>

    <div class="how">
      <div><b>몰입 중 막힐 때</b> · 한 장 뽑아 그 질문에만 5분 답해요. 답이 안 떠오르면 다시 뽑아도 돼요.</div>
      <div><b>나눔 시간에</b> · 말할 거리가 안 떠오르면 한 장 뽑아 그 질문으로 이야기해요.</div>
    </div>
    <div class="list" id="list"></div>
  </div></main>
</div>
<script>
(function(){
  'use strict';
  var G=[
    {n:'처음과 새로움',c:'var(--c1)',q:['올해 처음 해 본 일은?','올해 새로 알게 된 나의 모습은?','올해 처음 가 본 곳 중 다시 가고 싶은 곳은?','올해 새로 생긴 습관이나 루틴은?','올해 배운 것 중 가장 쓸모 있었던 것은?','올해 생각이 바뀐 것이 있다면?','올해 처음 만난 사람 중 기억에 남는 사람은?','올해 해 본 가장 용기 있는 일은?']},
    {n:'사람',c:'var(--c2)',q:['올해 나를 가장 많이 웃게 한 사람은?','올해 고맙다는 말을 제대로 못 한 사람은?','올해 가장 자주 연락한 사람은?','올해 나에게 도움을 준 한마디는?','올해 내가 누군가에게 힘이 되었던 순간은?','올해 멀어진 관계와 가까워진 관계는?','내년에 더 자주 만나고 싶은 사람은?']},
    {n:'순간과 감정',c:'var(--c3)',q:['올해 가장 행복했던 하루는 언제였나요?','올해 가장 많이 울었던(또는 울고 싶었던) 때는?','올해 가장 몰입했던 순간은?','올해 가장 잘 쉬었던 때는 언제, 어디서였나요?','올해 가장 후회 없는 소비는?','올해 가장 많이 들은 노래와 그때의 기분은?','올해 나를 버티게 한 것은?','올해 스스로가 자랑스러웠던 순간은?']},
    {n:'내려놓기와 내년',c:'var(--c4)',q:['올해 그만두길 잘한 것은?','올해 거절하길 잘한 것은?','올해의 나에게 한마디 해 준다면?','올해의 실패에서 배운 것은?','내년의 나에게 꼭 지키라고 하고 싶은 것 하나는?','내년에 덜 하고 싶은 것은?','1년 뒤 오늘, 어떤 모습이면 좋겠나요?']}
  ];
  var all=[],n=0;
  G.forEach(function(g,gi){ g.q.forEach(function(q){ all.push({no:++n,g:gi,q:q}); }); });
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var filter=-1, seen={};
  var fEl=document.getElementById('filters');
  fEl.innerHTML='<button type="button" data-g="-1" aria-pressed="true">전체</button>'+G.map(function(g,i){ return '<button type="button" data-g="'+i+'" aria-pressed="false">'+esc(g.n)+'</button>'; }).join('');
  fEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; filter=+b.dataset.g;
    fEl.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed',x===b); }); left(); });

  function pool(){ return all.filter(function(c){ return filter<0||c.g===filter; }); }
  function left(){ var p=pool(), r=p.filter(function(c){ return !seen[c.no]; }).length;
    document.getElementById('left').textContent=Object.keys(seen).length?('이 묶음에서 안 나온 카드 '+r+'장'):''; }
  function show(c){
    var card=document.getElementById('card'); card.classList.remove('empty','flip'); void card.offsetWidth; card.classList.add('flip');
    card.style.setProperty('--cc',G[c.g].c);
    document.getElementById('cat').textContent=G[c.g].n;
    document.getElementById('no').textContent='No. '+c.no;
    document.getElementById('q').textContent=c.q;
    document.getElementById('tip').textContent='이 질문에만 5분 답해 보세요';
    seen[c.no]=1; left();
  }
  document.getElementById('draw').addEventListener('click',function(){
    var p=pool(), r=p.filter(function(c){ return !seen[c.no]; });
    if(!r.length){ p.forEach(function(c){ delete seen[c.no]; }); r=p; }
    show(r[Math.floor(Math.random()*r.length)]); this.textContent='다시 뽑기';
  });

  document.getElementById('list').innerHTML='<div>'+[0,1].map(function(i){ return grp(i); }).join('')+'</div><div>'+[2,3].map(function(i){ return grp(i); }).join('')+'</div>';
  function grp(i){ var g=G[i];
    return '<div class="group" style="--cc:'+g.c+'"><h2>'+esc(g.n)+' <span>'+g.q.length+'장</span></h2><ol>'+all.filter(function(c){ return c.g===i; }).map(function(c){ return '<li data-no="'+c.no+'"><i>'+c.no+'</i>'+esc(c.q)+'</li>'; }).join('')+'</ol></div>'; }
  document.getElementById('list').addEventListener('click',function(e){ var li=e.target.closest('li'); if(!li) return;
    show(all[+li.dataset.no-1]); window.scrollTo({top:0,behavior:'smooth'}); });
})();
</script>
</body>
</html>
